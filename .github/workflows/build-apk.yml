name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download offline voice packs
        working-directory: android-app/app/src/main/assets
        run: |
          set -euxo pipefail
          mkdir -p voices
          curl -fL --retry 3 --retry-delay 5 -o xiaoya.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-zh_CN-xiao_ya-medium.tar.bz2
          tar -xjf xiaoya.tar.bz2
          mv vits-piper-zh_CN-xiao_ya-medium voices/xiaoya
          curl -fL --retry 3 --retry-delay 5 -o huayan.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-zh_CN-huayan-medium.tar.bz2
          tar -xjf huayan.tar.bz2
          mv vits-piper-zh_CN-huayan-medium voices/huayan
          curl -fL --retry 3 --retry-delay 5 -o matcha.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/matcha-icefall-zh-baker.tar.bz2
          tar -xjf matcha.tar.bz2
          mv matcha-icefall-zh-baker voices/matcha
          curl -fL --retry 3 --retry-delay 5 -o voices/matcha/vocos-22khz-univ.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/vocos-22khz-univ.onnx
      - name: Download sherpa-onnx Android runtime
        working-directory: android-app
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 5 -o sherpa-android.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.16/sherpa-onnx-v1.12.15-android.tar.bz2
          tar -xjf sherpa-android.tar.bz2
          jni_dir="$(find . -type d -name jniLibs -print -quit)"
          test -n "$jni_dir"
          rm -rf app/src/main/jniLibs
          cp -R "$jni_dir" app/src/main/jniLibs
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          curl -fL --retry 3 --retry-delay 5 -H 'Accept: application/vnd.github.raw+json' -o app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt 'https://api.github.com/repos/k2-fsa/sherpa-onnx/contents/android/SherpaOnnxTts/app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt?ref=master'
      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: deeptalking-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
