name: Build Kokoro Verify APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download kokoro voice pack
        working-directory: android-app/app/src/main/assets
        run: |
          set -euxo pipefail
          mkdir -p voices
          curl -fL --retry 3 --retry-delay 5 -o kokoro.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_1.tar.bz2
          tar -xjf kokoro.tar.bz2
          kokoro_dir="$(find . -maxdepth 1 -type d -name 'kokoro*' | head -1)"
          test -n "$kokoro_dir"
          mv "$kokoro_dir" voices/kokoro
          rm -f kokoro.tar.bz2
      - name: Download sherpa-onnx Android runtime
        working-directory: android-app
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 5 -o sherpa-android.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.16/sherpa-onnx-v1.12.15-android.tar.bz2
          tar -xjf sherpa-android.tar.bz2
          jni_dir="$(find . -type d -name jniLibs -print -quit)"
          test -n "$jni_dir"
          rm -rf app/src/main/jniLibs
          cp -R "$jni_dir" app/src/main/jniLibs
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          curl -fL --retry 3 --retry-delay 5 -H 'Accept: application/vnd.github.raw+json' -o app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt 'https://api.github.com/repos/k2-fsa/sherpa-onnx/contents/android/SherpaOnnxTts/app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt?ref=v1.12.15'
      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-verify-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
