name: Build Android Lite APK

on:
  workflow_dispatch:
  push:
    branches: [main, cloud-main]
    paths:
      - 'android-lite/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android-lite/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-lite/keystore/deeptalking-release.jks
      - name: Build release APK (fixed signature)
        working-directory: android-lite
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: deeptalking-lite-release-apk
          path: android-lite/app/build/outputs/apk/release/app-release.apk
