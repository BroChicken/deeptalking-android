name: Build Android Lite APK

on:
  workflow_dispatch:
  push:
    branches: [main, cloud-main]
    paths:
      - 'android-lite/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android-lite
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: deeptalking-lite-debug-apk
          path: android-lite/app/build/outputs/apk/debug/app-debug.apk
