// ==================== Chat & API Logic (Streaming/Non-Streaming) ====================
function discardConversationBranch(char, startIndex) {
  var removed = char.memory.instant.slice(startIndex);
  var removedIds = new Set(removed.map(function(message) { return message.id; }).filter(Boolean));
  char.memory.instant = char.memory.instant.slice(0, startIndex);
  function hasRemovedSource(item) {
    return (item.sourceMessageIds || []).some(function(id) { return removedIds.has(id); });
  }
  char.memory.shortTerm = char.memory.shortTerm.filter(function(item) { return !hasRemovedSource(item); });
  Object.keys(char.memory.longTerm).forEach(function(category) {
    char.memory.longTerm[category] = char.memory.longTerm[category].filter(function(item) { return !hasRemovedSource(item); });
  });
  char.memory.pendingRecall = char.memory.pendingRecall.filter(function(item) { return !hasRemovedSource(item); });
  char.memory.counters.shortTermItemsSinceAnalyze = Math.min(char.memory.counters.shortTermItemsSinceAnalyze, char.memory.shortTerm.length);
}

function editAndResendMessage(messageId) {
  if (state.isProcessing || !state.activeCharacterId) return;
  var char = state.characters[state.activeCharacterId];
  var message = char && char.memory.instant.find(function(item) { return item.id === messageId && item.role === 'user'; });
  if (!message) return;
  var text = prompt('编辑并重新发送消息：', message.content);
  if (text == null || !text.trim() || text.trim() === message.content) return;
  return sendMessage({ replaceMessageId: messageId, text: text.trim() });
}

function regenerateReply(messageId) {
  if (state.isProcessing || !state.activeCharacterId) return;
  return sendMessage({ regenerateMessageId: messageId });
}

async function sendMessage(options) {
  if (state.isProcessing || !state.activeCharacterId) return;
  options = options || {};
  var input = document.getElementById('messageInput');
  var char = state.characters[state.activeCharacterId];
  if (!char) return;
  if (!state.config.apiKey) {
    alert('未配置API Key，请在设置中填写');
    return;
  }

  invalidateQuickReplies();
  var text = typeof options.text === 'string' ? options.text.trim() : input.value.trim();
  var userMessage = null;
  if (options.regenerateMessageId) {
    var replyIndex = char.memory.instant.findIndex(function(item) { return item.id === options.regenerateMessageId && item.role === 'assistant' && !item.isLoading; });
    if (replyIndex === -1) return;
    var userIndex = replyIndex - 1;
    while (userIndex >= 0 && char.memory.instant[userIndex].role !== 'user') userIndex--;
    if (userIndex === -1) return;
    if (!confirm('将重新生成此回复，并丢弃它之后的对话分支和相关记忆，继续吗？')) return;
    discardConversationBranch(char, replyIndex);
    userMessage = char.memory.instant[userIndex];
    text = userMessage.content;
  } else if (options.replaceMessageId) {
    var replaceIndex = char.memory.instant.findIndex(function(item) { return item.id === options.replaceMessageId && item.role === 'user'; });
    if (replaceIndex === -1 || !text) return;
    if (!confirm('将以编辑后的消息重新生成回复，并丢弃该消息之后的对话分支和相关记忆，继续吗？')) return;
    discardConversationBranch(char, replaceIndex);
    var timestamp = new Date().toISOString();
    userMessage = { id: createMemoryId('msg'), role: 'user', content: text, timestamp: timestamp };
    char.memory.instant.push(userMessage);
  } else {
    if (!text) return;
    var newTimestamp = new Date().toISOString();
    userMessage = { id: createMemoryId('msg'), role: 'user', content: text, timestamp: newTimestamp };
    char.memory.instant.push(userMessage);
  }

  input.value = '';
  autoResize(input);
  var loadingMsg = { id: createMemoryId('msg'), role: 'assistant', content: '', timestamp: new Date().toISOString(), isLoading: true };
  char.memory.instant.push(loadingMsg);
  trimCharacterMemory(char);
  renderChat(true);
  saveData();

  state.isProcessing = true;
  var shouldRequestQuickReplies = false;
  try {
    var messages = buildRequestPayload(char, text);
    var response = await fetch(state.config.apiEndpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + state.config.apiKey
      },
      body: JSON.stringify(buildApiRequestBody(messages, state.config.aiParams.stream !== false))
    });
    if (!response.ok) {
      var errData = await response.json().catch(function() { return {}; });
      throw new Error(errData.error ? errData.error.message : 'HTTP ' + response.status);
    }

    var contentType = (response.headers.get('Content-Type') || '').toLowerCase();
    var isStreaming = contentType.indexOf('text/event-stream') !== -1;
    var fullText = '';
    if (isStreaming) {
      if (!response.body || !response.body.getReader) throw new Error('当前浏览器不支持流式响应');
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      while (true) {
        var chunk = await reader.read();
        if (chunk.done) { buffer += decoder.decode(); break; }
        buffer += decoder.decode(chunk.value, { stream: true });
        var lines = buffer.split('\n');
        buffer = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var trimmed = lines[i].trim();
          if (!trimmed || trimmed.indexOf('data:') !== 0) continue;
          var data = trimmed.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            var json = JSON.parse(data);
            if (json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content) {
              fullText += json.choices[0].delta.content;
              updateMessageBubble(loadingMsg.id, getDisplayText(fullText));
            }
          } catch (e) { /* ignore partial chunks */ }
        }
      }
      if (buffer.trim() && buffer.trim().indexOf('data:') === 0) {
        var lastData = buffer.trim().slice(5).trim();
        if (lastData !== '[DONE]') {
          try {
            var lastJson = JSON.parse(lastData);
            if (lastJson.choices && lastJson.choices[0] && lastJson.choices[0].delta && lastJson.choices[0].delta.content) fullText += lastJson.choices[0].delta.content;
          } catch (e) { /* ignore */ }
        }
      }
    } else {
      var responseJson = await response.json();
      if (responseJson.choices && responseJson.choices[0] && responseJson.choices[0].message) fullText = toText(responseJson.choices[0].message.content);
    }
    if (!fullText.trim()) throw new Error('收到空回复');

    consumeInjectedRecalls(char);
    var memUpdate = parseMemoryFromText(fullText, char);
    var hasStructuredMemory = memUpdate && memUpdate._accepted && (memUpdate._accepted.shortTerm + memUpdate._accepted.longTerm > 0);
    if (!hasStructuredMemory && shouldCaptureUserTurn(text)) {
      addShortTermMemory(char, '用户说：' + text, userMessage.timestamp, { sourceMessageIds: [userMessage.id], sourceRoles: ['user'], evidence: text });
    }
    loadingMsg.content = getDisplayText(fullText);
    loadingMsg.isLoading = false;
    loadingMsg.timestamp = new Date().toISOString();
    var cognitionReview = parseCognitionReview(fullText);
    if (cognitionReview && cognitionReview.triggered && classifyTimeQuery(text) === 'none' && cognitionReview.reason && cognitionReview.evidence) {
      await commitTriggeredCognition(char, cognitionReview, userMessage, loadingMsg);
    }
    await checkMemoryTriggers(char);
    saveData();
    renderChat();
    speakNativeReply(char, loadingMsg.content);
    shouldRequestQuickReplies = true;
  } catch (error) {
    console.error('API Error:', error);
    var loadingIndex = char.memory.instant.indexOf(loadingMsg);
    if (loadingIndex !== -1) char.memory.instant.splice(loadingIndex, 1);
    trimCharacterMemory(char);
    saveData();
    renderChat();
    alert('回复失败：' + error.message + '。你的消息已保留，可稍后重试。');
  } finally {
    state.isProcessing = false;
    if (shouldRequestQuickReplies && state.activeCharacterId === char.id) requestQuickReplies(char, loadingMsg);
  }
}

function getDisplayText(text) {
  var output = toText(text).replace(/<MEM_UPDATE>[\s\S]*?<\/MEM_UPDATE>/g, '').replace(/<COGNITION_TRIGGER>[\s\S]*?<\/COGNITION_TRIGGER>/g, '').replace(/<COGNITION_REVIEW>[\s\S]*?<\/COGNITION_REVIEW>/g, '');
  ['<MEM_UPDATE>', '<COGNITION_TRIGGER>', '<COGNITION_REVIEW>'].forEach(function(marker) {
    var index = output.indexOf(marker);
    if (index !== -1) output = output.substring(0, index);
  });
  return output.trim();
}

function speakNativeReply(char, text) {
  if (!window.AndroidTts || typeof window.AndroidTts.speak !== 'function') return;
  var voicePack = char && char.basicInfo && NATIVE_TTS_PROFILES[char.basicInfo.voicePack] ? char.basicInfo.voicePack : 'xiaoya';
  var profile = NATIVE_TTS_PROFILES[voicePack];
  try {
    window.AndroidTts.speak(JSON.stringify({ voicePack: voicePack, text: toText(text), speed: profile.speed, playbackRate: profile.playbackRate, volume: profile.volume }));
  } catch (error) {
    console.warn('Native TTS bridge failed:', error);
  }
}

function updateMessageBubble(messageId, text) {
  var container = document.getElementById('messageContainer');
  var rows = container.querySelectorAll('[data-role="assistant"][data-msg-id]');
  var row = Array.prototype.find.call(rows, function(item) { return item.dataset.msgId === messageId; });
  if (!row) return;
  var contentDiv = row.querySelector('.message-content');
  if (!contentDiv) return;
  var shouldFollow = isNearChatBottom(container);
  contentDiv.className = 'message-content';
  contentDiv.innerHTML = formatMessageContent(text);
  if (shouldFollow) container.scrollTop = container.scrollHeight;
}

function parseJsonPayload(text) {
  var cleaned = toText(text).trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
  if (!cleaned) throw new Error('JSON内容为空');
  try {
    return JSON.parse(cleaned);
  } catch (firstError) {
    var pairs = [['{', '}'], ['[', ']']];
    for (var i = 0; i < pairs.length; i++) {
      var start = cleaned.indexOf(pairs[i][0]);
      var end = cleaned.lastIndexOf(pairs[i][1]);
      if (start !== -1 && end > start) {
        try {
          return JSON.parse(cleaned.slice(start, end + 1));
        } catch (e) { /* try the other JSON shape */ }
      }
    }
    throw firstError;
  }
}

function getTimeContext(value) {
  var date = value instanceof Date ? value : new Date(value || Date.now());
  if (isNaN(date.getTime())) date = new Date();
  var resolved = Intl.DateTimeFormat().resolvedOptions();
  var timeZone = resolved.timeZone || '本地时区';
  var local = new Intl.DateTimeFormat('zh-CN', {
    year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'long',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    timeZone: timeZone
  }).format(date);
  var offsetMinutes = -date.getTimezoneOffset();
  var sign = offsetMinutes >= 0 ? '+' : '-';
  var absoluteOffset = Math.abs(offsetMinutes);
  var offset = 'UTC' + sign + String(Math.floor(absoluteOffset / 60)).padStart(2, '0') + ':' + String(absoluteOffset % 60).padStart(2, '0');
  return { local: local, iso: date.toISOString(), timeZone: timeZone, offset: offset };
}

function formatContextTime(timestamp) {
  var context = getTimeContext(timestamp);
  return context.local + ' (' + context.timeZone + ', ' + context.offset + ')';
}

function classifyTimeQuery(text) {
  var value = toText(text).replace(/[\s，。！？、,.!?]/g, '');
  if (!value) return 'none';
  if (/(现在|当前|此刻).{0,8}(几点|时间|日期|几号|星期)|几点了|当前时间|今天(是)?几号|今天(是)?星期几|请问(现在)?时间/.test(value)) return 'current';
  if (/(上次|之前|以前|刚才|昨天|前天|大前天|那天|什么时候|何时|多久前|多少天前|几天前|哪天|当时|过去).{0,16}(说|聊|提|发生|见|来|回|发|做|是|那件事|这件事)?/.test(value)) return 'history';
  return 'none';
}

function buildTimePrompt(char, query, recent, relevant, mode, currentTime) {
  if (mode === 'none') {
    return '【时间规则】本轮不是时间查询。不要主动提及时间；如果用户没有提供或询问时间，不要自行补充具体日期、时刻或经历时间。\n\n';
  }
  var lines = [];
  var prompt = '【时间基准】\n当前本地日期和时间: ' + currentTime.local + '\n时区: ' + currentTime.timeZone + ' (' + currentTime.offset + ')\n';
  if (mode === 'current') {
    prompt += '这是当前时间查询。直接以以上时间为准回答，不要换算成其他时区，不要根据聊天内容猜测。\n\n';
    return prompt;
  }
  recent.forEach(function(message) {
    appendWithinLimit(lines, '- ' + (message.role === 'user' ? '用户' : '角色') + ' | 发生时间: ' + formatContextTime(message.timestamp) + ' | 内容: ' + trimText(message.content, 700), 5200);
  });
  char.memory.shortTerm.slice(-12).forEach(function(item) {
    appendWithinLimit(lines, '- 短期记忆 | 记录时间: ' + formatContextTime(item.timestamp) + ' | 内容: ' + trimText(item.content, 500), 5200);
  });
  relevant.forEach(function(entry) {
    var item = entry.item;
    var eventTime = item.eventTime || item.createdAt || item.updatedAt;
    if (!eventTime) return;
    appendWithinLimit(lines, '- 已保存记忆 | 事件时间: ' + formatContextTime(eventTime) + ' | ' + trimText(item.key, 100) + ': ' + trimText(item.value, 500) + (item.evidence ? ' | 证据: ' + trimText(item.evidence, 220) : ''), 5200);
  });
  prompt += '这是历史时间查询。只能根据下面列出的时间和原文回答；如果没有能对应到用户问题的记录，明确说无法确定，不要按消息顺序、记忆新旧或常识推断具体日期。以下内容不含消息ID，不能用于来源追踪。\n';
  prompt += '【可用历史时间证据】\n' + (lines.join('\n') || '没有可用的历史时间证据') + '\n\n';
  return prompt;
}

function appendWithinLimit(lines, line, limit) {
  var used = lines.join('\n').length;
  if (used >= limit) return false;
  lines.push(trimText(line, Math.max(0, limit - used)));
  return true;
}

function getSearchTerms(text) {
  var normalized = toText(text).toLowerCase();
  var terms = normalized.match(/[a-z0-9_]{2,}|[\u4e00-\u9fff]{2,}/g) || [];
  var expanded = [];
  terms.forEach(function(term) {
    expanded.push(term);
    if (/^[\u4e00-\u9fff]+$/.test(term) && term.length > 2) {
      for (var i = 0; i < term.length - 1; i++) expanded.push(term.slice(i, i + 2));
    }
  });
  return Array.from(new Set(expanded)).slice(0, 40);
}

function retrieveRelevantMemories(char, query) {
  var terms = getSearchTerms(query);
  var now = Date.now();
  var candidates = [];
  Object.keys(char.memory.longTerm).forEach(function(category) {
    char.memory.longTerm[category].forEach(function(item) {
      var searchable = (toText(item.key) + ' ' + toText(item.value) + ' ' + (item.tags || []).join(' ')).toLowerCase();
      var score = Math.max(0, Math.min(10, Number(item.importance) || 0)) * 0.45;
      terms.forEach(function(term) {
        if (searchable.indexOf(term) !== -1) score += term.length > 2 ? 4 : 2;
      });
      var memoryTime = Date.parse(item.updatedAt || item.createdAt || '') || 0;
      var ageDays = memoryTime ? Math.max(0, (now - memoryTime) / 86400000) : 9999;
      score += Math.max(0, 2 - ageDays / 90);
      candidates.push({ item: item, category: category, score: score });
    });
  });
  candidates.sort(function(a, b) { return b.score - a.score; });
  var selected = candidates.slice(0, 8);
  var seen = new Set(selected.map(function(entry) { return entry.item.id || entry.category + ':' + entry.item.key; }));
  (char.memory.pendingRecall || []).forEach(function(item) {
    var id = item.id || 'pending:' + item.key;
    if (!seen.has(id) && selected.length < 10) {
      selected.unshift({ item: item, category: 'recalled', score: 999 });
      seen.add(id);
    }
  });
  return selected.slice(0, 10);
}

function getKnownSources(char) {
  var sources = Object.create(null);
  function register(id, role, text) {
    if (id && !sources[id] && role && text) sources[id] = { role: role, text: text };
  }
  char.memory.instant.forEach(function(message) {
    if (message.id && !message.isLoading) {
      sources[message.id] = { role: message.role, text: message.content };
    }
  });
  char.memory.shortTerm.forEach(function(item) {
    (item.sourceMessageIds || []).forEach(function(id, index) {
      if (!sources[id]) {
        register(id, (item.sourceRoles || [])[index] || '', item.evidence || item.content);
      }
    });
  });
  Object.keys(char.memory.longTerm || {}).forEach(function(category) {
    (char.memory.longTerm[category] || []).forEach(function(item) {
      (item.sourceMessageIds || []).forEach(function(id, index) {
        register(id, (item.sourceRoles || [])[index] || '', item.evidence || item.value);
      });
    });
  });
  ['self', 'environment'].forEach(function(type) {
    (char.coreCognition[type] || []).forEach(function(item) {
      (item.sourceMessageIds || []).forEach(function(id, index) {
        register(id, (item.sourceRoles || [])[index] || '', item.evidence || item.value);
      });
    });
  });
  Object.keys(char.autoUpdateMeta || {}).forEach(function(key) {
    var item = char.autoUpdateMeta[key];
    (item.sourceMessageIds || []).forEach(function(id, index) {
      register(id, (item.sourceRoles || [])[index] || '', item.evidence);
    });
  });
  return sources;
}

function resolveMemorySources(char, item) {
  var sourceIds = Array.isArray(item.sourceMessageIds) ? item.sourceMessageIds.map(function(id) { return toText(id); }).filter(Boolean).slice(0, 8) : [];
  var sources = getKnownSources(char);
  var resolved = sourceIds.map(function(id) { return { id: id, source: sources[id] }; });
  if (resolved.length === 0 || resolved.some(function(entry) { return !entry.source || !entry.source.role; })) return null;
  return resolved;
}

function isValidAutomaticMemory(char, item) {
  if (!isPlainObject(item) || !char.memory.longTerm[item.category]) return false;
  var subject = toText(item.subject);
  if (MEMORY_SUBJECTS.indexOf(subject) === -1 || subject === 'legacy' || subject === 'character') return false;
  var sources = resolveMemorySources(char, item);
  var evidence = trimText(item.evidence, 300);
  if (!sources || evidence.length < 2 || !sources.some(function(entry) { return evidenceMatches(entry.source.text, evidence); })) return false;
  var roles = sources.map(function(entry) { return entry.source.role; });
  var allUser = roles.every(function(role) { return role === 'user'; });
  var includesUser = roles.indexOf('user') !== -1;
  if (item.category === 'userProfile' || item.category === 'habits') return subject === 'user' && allUser;
  if (item.category === 'relationship') return subject === 'relationship' && includesUser;
  if (item.category === 'events') return (subject === 'user' && allUser) || ((subject === 'relationship' || subject === 'world') && includesUser);
  if (item.category === 'promises') return (subject === 'user' && allUser) || (subject === 'relationship' && includesUser);
  return false;
}

function addShortTermMemory(char, content, timestamp, sourceData) {
  var text = trimText(content, 500);
  if (!text) return false;
  var duplicate = char.memory.shortTerm.slice(-12).some(function(item) { return item.content === text; });
  if (duplicate) return false;
  var sourceIds = sourceData && Array.isArray(sourceData.sourceMessageIds) ? sourceData.sourceMessageIds.map(function(id) { return toText(id); }).filter(Boolean).slice(0, 8) : [];
  var knownSources = getKnownSources(char);
  if (sourceIds.length === 0 || sourceIds.some(function(id) { return !knownSources[id]; })) return false;
  var sourceRoles = sourceIds.map(function(id) { return knownSources[id].role; });
  char.memory.shortTerm.push({
    content: text,
    timestamp: timestamp || new Date().toISOString(),
    sourceMessageIds: sourceIds,
    sourceRoles: sourceRoles,
    evidence: trimText(sourceData && sourceData.evidence, 300)
  });
  char.memory.counters.shortTermItemsSinceAnalyze++;
  char.memory.shortTerm = char.memory.shortTerm.slice(-MEMORY_LIMITS.shortTerm);
  return true;
}

function shouldCaptureUserTurn(text) {
  var value = toText(text).trim();
  if (value.length < 3) return false;
  return !/^(你好|您好|嗨|哈喽|早安|晚安|在吗|谢谢|好的|嗯+|哈哈+)[！!。.，,\s]*$/.test(value);
}

function upsertLongTermMemory(char, item) {
  if (!isValidAutomaticMemory(char, item)) return false;
  var category = item.category;
  var key = trimText(item.key, 100);
  var value = trimText(item.value, 900);
  if (!key || !value) return false;
  var list = char.memory.longTerm[category];
  var existing = list.find(function(memory) {
    return toText(memory.key).toLowerCase() === key.toLowerCase();
  });
  var now = new Date().toISOString();
  var importance = Number(item.importance);
  importance = Number.isFinite(importance) ? Math.max(0, Math.min(10, importance)) : 5;
  var tags = Array.isArray(item.tags) ? item.tags.map(function(tag) { return trimText(tag, 30); }).filter(Boolean).slice(0, 8) : [];
  var status = category === 'promises' && PROMISE_STATUSES.indexOf(toText(item.status)) !== -1 ? toText(item.status) : 'active';
  var dueAt = category === 'promises' && item.dueAt ? normalizeTimestamp(item.dueAt, null) : null;
  if (existing) {
    existing.value = value;
    existing.tags = Array.from(new Set((existing.tags || []).concat(tags))).slice(0, 8);
    existing.importance = Math.max(Number(existing.importance) || 0, importance);
    existing.subject = item.subject;
    existing.sourceMessageIds = item.sourceMessageIds.slice(0, 8);
    existing.sourceRoles = resolveMemorySources(char, item).map(function(entry) { return entry.source.role; });
    existing.evidence = trimText(item.evidence, 300);
    existing.eventTime = normalizeTimestamp(item.eventTime, existing.eventTime || now);
    if (category === 'promises') {
      existing.status = status;
      existing.dueAt = dueAt || existing.dueAt || null;
    }
    existing.updatedAt = now;
  } else {
    list.push({
      id: createMemoryId('mem'),
      key: key, value: value, tags: tags, importance: importance,
      subject: item.subject,
      sourceMessageIds: item.sourceMessageIds.slice(0, 8),
      sourceRoles: resolveMemorySources(char, item).map(function(entry) { return entry.source.role; }),
      evidence: trimText(item.evidence, 300),
      eventTime: normalizeTimestamp(item.eventTime, now),
      dueAt: dueAt,
      status: status,
      recordedAt: now,
      createdAt: now, updatedAt: now, lastRecalled: null, recallCount: 0, relatedTo: []
    });
  }
  char.memory.longTerm[category] = pruneMemoryList(list, MEMORY_LIMITS.longTermPerCategory);
  return true;
}

function parseMemoryFromText(content, char) {
  var memUpdate = null;
  var memMatch = content.match(/<MEM_UPDATE>([\s\S]*?)<\/MEM_UPDATE>/);
  if (memMatch) {
    try {
      memUpdate = parseJsonPayload(memMatch[1]);
    } catch (e) {
      console.error('Failed to parse memory update JSON:', e);
    }
  }
  if (!isPlainObject(memUpdate)) return null;

  memUpdate._accepted = { shortTerm: 0, longTerm: 0 };
  if (Array.isArray(memUpdate.shortTerm)) {
    memUpdate.shortTerm.forEach(function(item) {
      var value = isPlainObject(item) ? (item.content || item.value || item.point) : item;
      if (addShortTermMemory(char, value, new Date().toISOString(), item)) memUpdate._accepted.shortTerm++;
    });
  }
  if (Array.isArray(memUpdate.longTerm)) {
    memUpdate.longTerm.forEach(function(item) {
      if (upsertLongTermMemory(char, item)) memUpdate._accepted.longTerm++;
    });
  }
  if (isPlainObject(memUpdate.recall)) handleRecall(memUpdate.recall, char);
  trimCharacterMemory(char);
  return memUpdate;
}

function parseCognitionReview(content) {
  var source = toText(content);
  var match = source.match(/<COGNITION_REVIEW>([\s\S]*?)<\/COGNITION_REVIEW>/);
  if (!match) match = source.match(/<COGNITION_TRIGGER>([\s\S]*?)<\/COGNITION_TRIGGER>/);
  if (!match) return null;
  try {
    var review = parseJsonPayload(match[1]);
    var triggered = review.triggered === true || source.indexOf('<COGNITION_TRIGGER>') !== -1;
    var reason = trimText(review.reason, 300);
    var evidence = trimText(review.evidence, 300);
    return { triggered: triggered, reason: reason, evidence: evidence };
  } catch (e) {
    console.error('Failed to parse cognition review JSON:', e);
    return null;
  }
}

function normalizeEvidenceText(value) {
  return toText(value).toLowerCase().replace(/[\s\u3000，。！？、；：,.!?;:'"“”‘’（）()【】\[\]{}]/g, '');
}

function evidenceMatches(source, evidence) {
  var left = normalizeEvidenceText(source);
  var right = normalizeEvidenceText(evidence);
  return right.length >= 2 && (left.indexOf(right) !== -1 || (right.length >= 8 && right.indexOf(left) !== -1));
}

function getTriggeredCognitionSources(char, trigger, userMessage, assistantMessage) {
  var sources = [];
  if (userMessage && !userMessage.isLoading) sources.push(userMessage);
  char.memory.instant.forEach(function(message) {
    if (!message.isLoading && (message.role === 'user' || message.role === 'assistant') && evidenceMatches(message.content, trigger.evidence) && sources.indexOf(message) === -1) sources.push(message);
  });
  if (!sources.some(function(message) { return message.role === 'user'; })) return [];
  if (assistantMessage && sources.indexOf(assistantMessage) === -1) sources.push(assistantMessage);
  return sources.slice(-4);
}

function isValidCognitionUpdate(char, item) {
  if (!isPlainObject(item)) return false;
  var key = trimText(item.key, 80);
  var value = trimText(item.value, 500);
  var evidence = trimText(item.evidence, 300);
  var sourceIds = Array.isArray(item.sourceMessageIds) ? item.sourceMessageIds.map(function(id) { return toText(id); }).filter(Boolean).slice(0, 8) : [];
  var knownSources = getKnownSources(char);
  var sources = sourceIds.map(function(id) { return knownSources[id]; }).filter(Boolean);
  return Boolean(key && value && evidence.length >= 2 && sources.length === sourceIds.length && sources.some(function(source) { return source.role === 'user' && evidenceMatches(source.text, evidence); }));
}

function upsertCognition(char, type, item) {
  if (!char.aiUpdatePolicy.cognition[type] || !isValidCognitionUpdate(char, item)) return false;
  var key = trimText(item.key, 80);
  var value = trimText(item.value, 500);
  var sourceIds = item.sourceMessageIds.map(function(id) { return toText(id); }).filter(Boolean).slice(0, 8);
  var sources = getKnownSources(char);
  var now = new Date().toISOString();
  var list = char.coreCognition[type];
  var existing = list.find(function(entry) { return toText(entry.key).toLowerCase() === key.toLowerCase(); });
  var entry = {
    key: key, value: value, sourceMessageIds: sourceIds,
    sourceRoles: sourceIds.map(function(id) { return sources[id].role; }),
    evidence: trimText(item.evidence, 300), updatedAt: now, status: 'pending'
  };
  if (existing) Object.assign(existing, entry);
  else list.push(entry);
  char.coreCognition[type] = normalizeCognitionList(list).slice(-MEMORY_LIMITS.cognitionPerType);
  return true;
}

function upsertAutoBasicField(char, key, item) {
  if (!char.aiUpdatePolicy.basicInfo[key] || !isPlainObject(item)) return false;
  var value = trimText(item.value, 700);
  var evidence = trimText(item.evidence, 300);
  var sourceIds = Array.isArray(item.sourceMessageIds) ? item.sourceMessageIds.map(function(id) { return toText(id); }).filter(Boolean).slice(0, 8) : [];
  var knownSources = getKnownSources(char);
  if (!value || evidence.length < 2 || sourceIds.length === 0 || sourceIds.some(function(id) { return !knownSources[id]; })) return false;
  if (!sourceIds.some(function(id) { return knownSources[id].role === 'user' && evidenceMatches(knownSources[id].text, evidence); })) return false;
  var now = new Date().toISOString();
  char.basicInfo[key] = value;
  char.autoUpdateMeta[key] = {
    evidence: evidence,
    sourceMessageIds: sourceIds,
    sourceRoles: sourceIds.map(function(id) { return knownSources[id].role; }),
    updatedAt: now,
    status: 'pending'
  };
  return true;
}

async function commitTriggeredCognition(char, trigger, userMessage, assistantMessage) {
  var sources = getTriggeredCognitionSources(char, trigger, userMessage, assistantMessage);
  if (sources.length === 0) return false;
  var sourceData = sources.map(function(message) {
    return { id: message.id, role: message.role, content: trimText(message.content, 1000), timestamp: message.timestamp };
  });
  var allowedFields = DYNAMIC_BASIC_FIELDS.filter(function(field) { return char.aiUpdatePolicy.basicInfo[field.key]; }).map(function(field) { return field.key; });
  var prompt = '角色已明确报告一次持续性认知触动。只基于以下带ID的证据进行更新。不要改写角色的静态身份、人格、背景或世界设定。只有来源和用户原话证据充分时才输出；每项必须引用来源消息ID，并在evidence中逐字摘录用户原话。核心认知更新状态统一为pending。允许更新的动态基础字段只有：' + (allowedFields.join(', ') || '无') + '。\n触发原因: ' + trigger.reason + '\n触发证据: ' + trigger.evidence + '\n相关消息:\n' + JSON.stringify(sourceData) + '\n\n返回JSON：{"coreCognition":{"self":[{"key":"稳定认知主题","value":"更新后的认知","sourceMessageIds":["msg_id"],"evidence":"用户原话短句"}],"environment":[{"key":"环境认知主题","value":"更新后的认知","sourceMessageIds":["msg_id"],"evidence":"用户原话短句"}]},"basicInfoUpdates":{"currentSituation":{"value":"新的当前处境","sourceMessageIds":["msg_id"],"evidence":"用户原话短句"}}}。coreCognition没有可靠更新时返回空数组；basicInfoUpdates只能使用允许的字段，没有可靠更新时返回空对象。';
  try {
    var response = await callAPI([
      { role: 'system', content: '你是角色认知审校助手。只返回JSON，不要其他文字。' },
      { role: 'user', content: prompt }
    ]);
    var update = parseJsonPayload(response.choices[0].message.content);
    var cognition = isPlainObject(update) && isPlainObject(update.coreCognition) ? update.coreCognition : { self: [], environment: [] };
    var accepted = 0;
    ['self', 'environment'].forEach(function(type) {
      (Array.isArray(cognition[type]) ? cognition[type] : []).forEach(function(item) {
        if (upsertCognition(char, type, item)) accepted++;
      });
    });
    var fieldUpdates = isPlainObject(update) && isPlainObject(update.basicInfoUpdates) ? update.basicInfoUpdates : {};
    Object.keys(fieldUpdates).forEach(function(key) {
      if (upsertAutoBasicField(char, key, fieldUpdates[key])) accepted++;
    });
    return accepted > 0;
  } catch (e) {
    console.error('Triggered cognition update failed:', e);
    return false;
  }
}

function buildRoleContext(char) {
  var primaryFields = ['name', 'personality', 'values', 'goals', 'currentSituation', 'relationshipWithUser', 'speakingStyle', 'scene', 'worldView'];
  var secondaryFields = ['gender', 'age', 'race', 'occupation', 'appearance', 'emotionalTendency', 'fears', 'background', 'sceneNotes'];
  var lines = [];
  primaryFields.forEach(function(key) {
    var value = trimText(char.basicInfo[key], 700);
    var meta = char.autoUpdateMeta && char.autoUpdateMeta[key];
    var fieldStatus = meta && meta.status === 'pending' ? '（待确认）' : (meta && meta.status === 'outdated' ? '（待复查）' : '');
    if (value) appendWithinLimit(lines, key + fieldStatus + ': ' + value, PROMPT_LIMITS.roleChars);
  });
  ['self', 'environment'].forEach(function(type) {
    char.coreCognition[type].forEach(function(item) {
      if (item.status === 'outdated') return;
      appendWithinLimit(lines, type + (item.status === 'pending' ? '（待确认）' : '') + '/' + trimText(item.key, 80) + ': ' + trimText(item.value, 500), PROMPT_LIMITS.roleChars);
    });
  });
  secondaryFields.forEach(function(key) {
    var value = trimText(char.basicInfo[key], 500);
    var meta = char.autoUpdateMeta && char.autoUpdateMeta[key];
    var fieldStatus = meta && meta.status === 'pending' ? '（待确认）' : (meta && meta.status === 'outdated' ? '（待复查）' : '');
    if (value) appendWithinLimit(lines, key + fieldStatus + ': ' + value, PROMPT_LIMITS.roleChars);
  });
  return lines.join('\n');
}

function formatElapsedTime(milliseconds) {
  var minutes = Math.max(0, Math.floor(milliseconds / 60000));
  if (minutes < 2) return '刚刚';
  if (minutes < 60) return minutes + '分钟';
  var hours = Math.floor(minutes / 60);
  if (hours < 48) return hours + '小时' + (minutes % 60 ? (minutes % 60) + '分钟' : '');
  var days = Math.floor(hours / 24);
  return days + '天' + (hours % 24 ? (hours % 24) + '小时' : '');
}

function getLastReplyGap(char) {
  var messages = char.memory.instant.filter(function(message) { return !message.isLoading && !message.isError; });
  if (messages.length < 2) return null;
  var current = messages[messages.length - 1];
  for (var i = messages.length - 2; i >= 0; i--) {
    if (messages[i].role !== 'assistant') continue;
    var previousTime = Date.parse(messages[i].timestamp);
    var currentTime = Date.parse(current.timestamp);
    if (!previousTime || !currentTime || currentTime < previousTime) return null;
    var milliseconds = currentTime - previousTime;
    return {
      milliseconds: milliseconds,
      text: formatElapsedTime(milliseconds),
      reconnect: milliseconds >= 6 * 60 * 60 * 1000,
      longAbsence: milliseconds >= 3 * 24 * 60 * 60 * 1000
    };
  }
  return null;
}

function getPromiseContext(char) {
  var now = Date.now();
  var promises = (char.memory.longTerm.promises || []).filter(function(item) {
    return (item.status || 'active') === 'active';
  }).map(function(item) {
    var dueTime = item.dueAt ? Date.parse(item.dueAt) : 0;
    return { item: item, dueTime: dueTime, overdue: dueTime > 0 && dueTime < now };
  }).sort(function(a, b) {
    if (a.overdue !== b.overdue) return a.overdue ? -1 : 1;
    if (!a.dueTime) return 1;
    if (!b.dueTime) return -1;
    return a.dueTime - b.dueTime;
  }).slice(0, 6);
  if (promises.length === 0) return '';
  var lines = promises.map(function(entry) {
    var item = entry.item;
    var due = entry.dueTime ? '，截止/约定时间：' + formatContextTime(item.dueAt) : '';
    return '- [' + (entry.overdue ? '待确认，已过期' : '进行中') + '] ' + trimText(item.key, 80) + ': ' + trimText(item.value, 260) + due;
  });
  return lines.join('\n');
}

function buildRequestPayload(char, query) {
  var time = getTimeContext(new Date());
  var timeMode = classifyTimeQuery(query);
  var replyGap = getLastReplyGap(char);
  var relevant = retrieveRelevantMemories(char, query || '');
  char.memory.lastInjectedRecallIds = relevant.filter(function(entry) { return entry.category === 'recalled' && entry.item && entry.item.id; }).map(function(entry) { return entry.item.id; }).slice(0, MEMORY_LIMITS.pendingRecall);
  var recent = char.memory.instant.filter(function(msg) { return !msg.isLoading; }).slice(-14);
  var memoryLines = [];
  relevant.forEach(function(entry) {
    var item = entry.item;
    var line = '[' + entry.category + '/' + (item.subject || 'legacy') + '] ' + trimText(item.key, 100) + ': ' + trimText(item.value, 700);
    appendWithinLimit(memoryLines, line, PROMPT_LIMITS.memoryChars);
  });

  var shortLines = [];
  char.memory.shortTerm.slice(-12).forEach(function(item) {
    appendWithinLimit(shortLines, trimText(item.content, 450), PROMPT_LIMITS.shortTermChars);
  });

  var systemPrompt = buildTimePrompt(char, query, recent, relevant, timeMode, time);
  var updatePolicy = normalizeAiUpdatePolicy(char.aiUpdatePolicy);
  var allowedAutoFields = DYNAMIC_BASIC_FIELDS.filter(function(field) { return updatePolicy.basicInfo[field.key]; }).map(function(field) { return field.key; });
  systemPrompt += '消息ID只在角色产生明确且持续的认知触动、并且触发认知审校时使用；普通聊天和时间查询都不提供消息ID。\n\n';
  systemPrompt += '【角色与稳定认知】\n' + buildRoleContext(char) + '\n\n';
  systemPrompt += '【本轮主动召回的相关长期记忆】\n' + (memoryLines.join('\n') || '无相关长期记忆') + '\n\n';
  systemPrompt += '【近期摘要记忆】\n' + (shortLines.join('\n') || '无') + '\n\n';
  var promiseContext = getPromiseContext(char);
  if (promiseContext) {
    systemPrompt += '【待跟进承诺】\n' + promiseContext + '\n已过期不等于已完成或失约；仅在当前话题合适时温和确认，不要突然追问。\n\n';
  }
  if (replyGap) {
    systemPrompt += '【互动节奏】距角色上次有效回复已过：' + replyGap.text + '。\n';
    if (replyGap.reconnect) {
      systemPrompt += '仅本轮：这是一次' + (replyGap.longAbsence ? '较久' : '短暂') + '的重连。若语境自然，可用一句温和、不施压的方式表现出重新见面；不要责备用户、暗示一直在等待，也不要编造这段时间发生过的事。\n';
    }
    systemPrompt += '\n';
  }
  systemPrompt += '【交互规则】\n';
  systemPrompt += '1. 始终保持角色身份，以长期陪伴关系连续地回应；先使用已提供的记忆，不要让用户反复说明已记录的事情。\n';
  systemPrompt += '2. 可使用Markdown：标题、强调、删除线、列表、引用、链接、行内/块级代码与表格；数学可用$...$或$$...$$。动作、表情、心理活动可用括号表示，但不超过回复一半。\n';
  systemPrompt += '3. 回复末尾必须附加对用户不可见的<COGNITION_REVIEW>JSON</COGNITION_REVIEW>。没有持续性触动时返回<COGNITION_REVIEW>{"triggered":false}</COGNITION_REVIEW>。只有用户透露重要经历/价值观、关系发生转折、角色修正了长期自我理解、或环境形成持续变化时才返回{"triggered":true,"reason":"触动原因","evidence":"逐字摘录的用户原话"}。短暂情绪、礼貌回应、普通闲聊、提问时间或日期都必须为false。不要在该JSON中写消息ID。\n';
  systemPrompt += '4. 当前允许自动更新的基础字段: ' + (allowedAutoFields.join(', ') || '无') + '。未授权字段和静态设定不得自动修改。\n';
  systemPrompt += '5. 标签外是给用户看的内容。不要向用户解释隐藏标签、内部时间或消息ID。\n';

  var recentMessages = [];
  var usedChars = 0;
  for (var i = recent.length - 1; i >= 0; i--) {
    var msg = recent[i];
    var content = trimText(msg.content, 1400);
    if (usedChars + content.length > PROMPT_LIMITS.recentChars && recentMessages.length > 0) break;
    recentMessages.unshift({ role: msg.role === 'user' ? 'user' : 'assistant', content: trimText(content, PROMPT_LIMITS.recentChars - usedChars) });
    usedChars += content.length;
  }
  return [{ role: 'system', content: systemPrompt }].concat(recentMessages);
}

function buildApiRequestBody(messages, stream) {
  var params = normalizeAiParams(state.config.aiParams);
  state.config.aiParams = params;
  var body = {
    model: state.config.modelName,
    messages: messages,
    temperature: params.temperature,
    top_p: params.topP,
    presence_penalty: params.presencePenalty,
    frequency_penalty: params.frequencyPenalty
  };
  if (params.maxTokens > 0) body.max_tokens = params.maxTokens;
  if (typeof stream === 'boolean') body.stream = stream;
  return body;
}

async function callAPI(messages) {
  if (!state.config.apiKey) {
    throw new Error('未配置API Key，请在设置中填写');
  }
  var bodyData = buildApiRequestBody(messages, null);
  var response = await fetch(state.config.apiEndpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.config.apiKey },
    body: JSON.stringify(bodyData)
  });
  if (!response.ok) {
    var errData = await response.json().catch(function() { return {}; });
    throw new Error(errData.error ? errData.error.message : 'HTTP ' + response.status);
  }
  return response.json();
}

function invalidateQuickReplies() {
  state.quickReplyToken++;
  state.quickReplies = [];
}

function parseQuickReplyList(content) {
  var parsed;
  try {
    parsed = parseJsonPayload(content);
  } catch (e) {
    return [];
  }
  var values = Array.isArray(parsed) ? parsed : (parsed && (parsed.replies || parsed.quickReplies || parsed.suggestions));
  if (!Array.isArray(values)) return [];
  var seen = {};
  return values.map(function(item) {
    return isPlainObject(item) ? (item.text || item.content || item.reply) : item;
  }).map(function(item) {
    return trimText(item, 120).replace(/\s+/g, ' ').trim();
  }).filter(function(item) {
    var key = item.toLowerCase();
    if (!item || seen[key]) return false;
    seen[key] = true;
    return true;
  }).slice(0, 2);
}

async function requestQuickReplies(char, assistantMessage) {
  if (!char || !assistantMessage || !state.config.apiKey) return;
  var token = ++state.quickReplyToken;
  state.quickReplies = [];
  var recent = char.memory.instant.filter(function(message) { return !message.isLoading && !message.isError; }).slice(-10);
  var transcript = recent.map(function(message) {
    return (message.role === 'user' ? '用户' : '角色') + ': ' + trimText(message.content, 900);
  }).join('\n');
  var messages = [
    { role: 'system', content: '你是聊天快速回应推荐器，不是角色本人。根据角色刚刚的回复，为用户生成两条自然、简短、可直接发送的中文回应。两条回应要有明显差异，一条偏直接回应，一条可以延伸话题。不要替用户编造事实，不要使用Markdown、括号动作、消息ID、时间元数据或隐藏标签。只返回JSON数组，必须正好包含两条字符串，每条不超过80字。' },
    { role: 'user', content: '角色设定:\n' + buildRoleContext(char) + '\n\n最近对话:\n' + transcript + '\n\n请推荐两条用户下一句可以直接发送的话。' }
  ];
  try {
    var response = await callAPI(messages);
    if (token !== state.quickReplyToken || state.activeCharacterId !== char.id) return;
    var content = response && response.choices && response.choices[0] && response.choices[0].message ? response.choices[0].message.content : '';
    var replies = parseQuickReplyList(content);
    state.quickReplies = replies.length === 2 ? replies : [];
    renderChat();
  } catch (e) {
    if (token === state.quickReplyToken) {
      state.quickReplies = [];

  }
}

function handleRecall(recallRequest, char) {
  var category = toText(recallRequest.category);
  var tags = Array.isArray(recallRequest.tags) ? recallRequest.tags.map(function(tag) { return toText(tag).toLowerCase(); }) : [];
  var results = [];
  if (category && char.memory.longTerm[category]) {
    results = char.memory.longTerm[category].filter(function(item) {
      if (tags.length === 0) return true;
      var searchable = (toText(item.key) + ' ' + toText(item.value) + ' ' + (item.tags || []).join(' ')).toLowerCase();
      return tags.some(function(tag) { return searchable.indexOf(tag) !== -1; });
    });
  }
  results.sort(function(a, b) { return memorySortScore(b) - memorySortScore(a); });
  results = results.slice(0, MEMORY_LIMITS.pendingRecall);
  if (results.length > 0) {
    char.memory.pendingRecall = results;
    results.forEach(function(item) {
      item.lastRecalled = new Date().toISOString();
      item.recallCount++;
    });
  }
}

function consumeInjectedRecalls(char) {
  var ids = Array.isArray(char.memory.lastInjectedRecallIds) ? char.memory.lastInjectedRecallIds : [];
  if (ids.length > 0) {
    char.memory.pendingRecall = (char.memory.pendingRecall || []).filter(function(item) {
      return ids.indexOf(item.id) === -1;
    });
  }
  char.memory.lastInjectedRecallIds = [];
}

function scheduleMemoryRetry(counters, task) {
  var failureKey = task === 'extraction' ? 'extractionFailures' : 'analysisFailures';
  var retryKey = task === 'extraction' ? 'extractionRetryAt' : 'analysisRetryAt';
  var failures = Math.min(10, (Number(counters[failureKey]) || 0) + 1);
  var delayMinutes = Math.min(30, 5 * Math.pow(2, failures - 1));
  counters[failureKey] = failures;
  counters[retryKey] = new Date(Date.now() + delayMinutes * 60000).toISOString();
}

function resetMemoryRetry(counters, task) {
  var failureKey = task === 'extraction' ? 'extractionFailures' : 'analysisFailures';
  var retryKey = task === 'extraction' ? 'extractionRetryAt' : 'analysisRetryAt';
  counters[failureKey] = 0;
  counters[retryKey] = null;
}

function canRunMemoryTask(counters, task) {
  var retryKey = task === 'extraction' ? 'extractionRetryAt' : 'analysisRetryAt';
  return !counters[retryKey] || Date.parse(counters[retryKey]) <= Date.now();
}

async function checkMemoryTriggers(char) {
  var counters = char.memory.counters;
  counters.instantRoundsSinceExtract++;
  if (char.memory.instant.length > 12 && counters.instantRoundsSinceExtract >= 5 && canRunMemoryTask(counters, 'extraction')) {
    var extracted = await extractInstantToShortTerm(char);
    if (extracted) {
      counters.instantRoundsSinceExtract = 0;
      resetMemoryRetry(counters, 'extraction');
    } else {
      scheduleMemoryRetry(counters, 'extraction');
    }
  }
  if (char.memory.shortTerm.length >= 20 && counters.shortTermItemsSinceAnalyze >= 20 && canRunMemoryTask(counters, 'analysis')) {
    var analyzed = await analyzeShortToLongTerm(char);
    if (analyzed) {
      counters.shortTermItemsSinceAnalyze = 0;
      resetMemoryRetry(counters, 'analysis');
    } else {
      scheduleMemoryRetry(counters, 'analysis');
    }
  }
  trimCharacterMemory(char);
}

async function extractInstantToShortTerm(char) {
  if (char.memory.instant.length <= 8) return false;
  var lastExtractedAt = Date.parse(char.memory.counters.lastExtractedAt || '') || 0;
  var sourceMessages = char.memory.instant.slice(0, -8).filter(function(m) {
    return !m.isLoading && (Date.parse(m.timestamp || '') || 0) > lastExtractedAt;
  });
  var messagesToExtract = sourceMessages.map(function(message, index) {
    return { index: index, role: message.role, content: trimText(message.content, 1200) };
  });
  if (messagesToExtract.length === 0) return false;
  var prompt = '分析以下带本地索引的对话，提取对后续几轮有帮助、但尚不值得作为长期事实的要点。不要输出消息ID或时间戳。每个要点必须引用sourceIndexes中的一个或多个索引，并在evidence中逐字摘录原话短句。返回JSON数组：[{"content":"要点","sourceIndexes":[0],"evidence":"原话短句"}]。没有合格内容返回[]。\n对话内容:\n' + JSON.stringify(messagesToExtract);
  try {
    var response = await callAPI([
      { role: 'system', content: '你是一个信息提取助手。只返回JSON数组，不要其他文字。' },
      { role: 'user', content: prompt }
    ]);
    var content = response.choices[0].message.content;
    var points = parseJsonPayload(content);
    if (Array.isArray(points)) points = points.filter(isPlainObject);
    if (Array.isArray(points) && points.length > 0) {
      var accepted = 0;
      points.forEach(function(point) {
        var indexes = Array.isArray(point.sourceIndexes) ? point.sourceIndexes.map(function(index) { return Number(index); }).filter(function(index) { return Number.isInteger(index) && sourceMessages[index]; }).slice(0, 8) : [];
        var sourceMessageIds = indexes.map(function(index) { return sourceMessages[index].id; });
        var sourceRoles = indexes.map(function(index) { return sourceMessages[index].role; });
        var sourceData = { sourceMessageIds: sourceMessageIds, sourceRoles: sourceRoles, evidence: point.evidence };
        if (addShortTermMemory(char, point.content, new Date().toISOString(), sourceData)) accepted++;
      });
      if (accepted === 0) return false;
      char.memory.counters.lastExtractedAt = sourceMessages[sourceMessages.length - 1].timestamp;
      trimCharacterMemory(char);
      return true;
    }
    return false;
  } catch (e) {
    console.error('Extraction failed:', e);
    return false;
  }
}

async function analyzeShortToLongTerm(char) {
  if (char.memory.shortTerm.length < 20) return false;
  var itemsToAnalyze = char.memory.shortTerm.slice(0, 20);
  var analysisItems = itemsToAnalyze.map(function(item, index) {
    return { index: index, content: trimText(item.content, 500), evidence: trimText(item.evidence, 300) };
  });
  var prompt = '分析以下带本地索引和证据的短期记忆，提取未来仍有价值的稳定事实。不要输出消息ID。角色核心认知不可修改。合并重复或冲突条目；事件、承诺保留必要日期；普通寒暄不要进入长期记忆。每条输出必须引用sourceIndexes中的短期记忆索引，并沿用evidence。\n分类规则：userProfile/habits仅限用户事实，subject=user；relationship仅限双方关系，subject=relationship；events只记录用户陈述或共同事件；promises只记录用户明确承诺或双方明确约定。承诺status只能是active、resolved、cancelled，只有证据明确完成/取消时才能变更；存在明确期限才填写dueAt。\n条目:\n' + JSON.stringify(analysisItems) + '\n\n返回JSON格式:\n{"longTerm": [{"category": "...", "subject": "user|relationship|world", "key": "稳定且可复用的标识", "value": "...", "tags": [...], "importance": 1-10, "sourceIndexes": [0], "evidence": "原话短句", "eventTime": "ISO时间", "status": "active|resolved|cancelled", "dueAt": "ISO时间"}]}\ncategory可选: userProfile, relationship, events, promises, habits';
  try {
    var response = await callAPI([
      { role: 'system', content: '你是一个记忆分析助手。只返回JSON，不要其他文字。' },
      { role: 'user', content: prompt }
    ]);
    var content = response.choices[0].message.content;
    var update = parseJsonPayload(content);
    if (!isPlainObject(update)) throw new Error('记忆分析结果不是对象');
    if (update.longTerm != null && !Array.isArray(update.longTerm)) throw new Error('longTerm 格式错误');
    var longTermUpdates = (update.longTerm || []).filter(function(item) {
      return isPlainObject(item) && char.memory.longTerm[item.category];
    });
    var accepted = 0;
    var consumedIndexes = new Set();
    longTermUpdates.forEach(function(item) {
      var indexes = Array.isArray(item.sourceIndexes) ? item.sourceIndexes.map(function(index) { return Number(index); }).filter(function(index) { return Number.isInteger(index) && itemsToAnalyze[index]; }).slice(0, 8) : [];
      item.sourceMessageIds = Array.from(new Set(indexes.reduce(function(ids, index) { return ids.concat(itemsToAnalyze[index].sourceMessageIds || []); }, []))).slice(0, 8);
      item.sourceRoles = item.sourceMessageIds.map(function(id) {
        var source = getKnownSources(char)[id];
        return source ? source.role : '';
      }).filter(Boolean);
      if (upsertLongTermMemory(char, item)) {
        accepted++;
        indexes.forEach(function(index) { consumedIndexes.add(index); });
      }
    });
    if (accepted === 0) return false;
    char.memory.shortTerm = char.memory.shortTerm.filter(function(item, index) {
      return index >= itemsToAnalyze.length || !consumedIndexes.has(index);
    });
    trimCharacterMemory(char);
    return true;
  } catch (e) {
    console.error('Analysis failed:', e);
    return false;
  }
}

// 安卓兼容性最好的 execCommand 复制方案
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '-9999px';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  
  // iOS 和安卓需要聚焦并选择
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  
  try {
    var successful = document.execCommand('copy');
    if (successful) {
      alert('已复制全部内容到剪贴板');
    } else {
      alert('复制失败，请手动长按文本框选择');
    }
  } catch (err) {
    alert('复制失败，请手动长按文本框选择');
  }
  
  document.body.removeChild(ta);
}

      var normalizedData = normalizeAppData(data, true);
      if (!confirm('导入将覆盖当前所有数据，确定继续？')) return;
      applyNormalizedData(normalizedData);
      saveData();
      applyTheme();
      renderCharacterList();
      renderChat();
      loadSettingsForm();
      alert('导入成功');
    } catch (err) {
      alert('导入失败: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ==================== UI Helpers ====================
function showStatus(text, type) {
  // 状态灯已移除，由聊天气泡中的打字指示器替代
}

function handleInputKey(event) {
  if (event.isComposing) return;
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
}

function toggleSidebar(force) {
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  if (force === false) {
    sidebar.classList.add('hidden-sidebar');
    overlay.classList.add('hidden');
    state.sidebarOpen = false;
  } else if (force === true) {
    sidebar.classList.remove('hidden-sidebar');
    if (window.innerWidth < 768) overlay.classList.remove('hidden');
    state.sidebarOpen = true;
  } else {
    sidebar.classList.toggle('hidden-sidebar');
    if (window.innerWidth < 768) overlay.classList.toggle('hidden');
    state.sidebarOpen = !state.sidebarOpen;
  }
}

function switchTab(tab) {
  document.getElementById('tab-characters').classList.remove('active');
  document.getElementById('tab-settings').classList.remove('active');
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('content-characters').classList.add('hidden');
  document.getElementById('content-settings').classList.add('hidden');
  document.getElementById('content-' + tab).classList.remove('hidden');
  if (tab === 'settings') loadSettingsForm();
}

function loadSettingsForm() {
  document.getElementById('apiPlatform').value = state.config.apiPlatform;
  document.getElementById('apiEndpoint').value = state.config.apiEndpoint;
  document.getElementById('apiKey').value = state.config.apiKey;
  document.getElementById('modelName').value = state.config.modelName;
  var params = normalizeAiParams(state.config.aiParams);
  document.getElementById('aiTemperature').value = params.temperature;
  document.getElementById('aiMaxTokens').value = params.maxTokens || '';
  document.getElementById('aiTopP').value = params.topP;
  document.getElementById('aiPresencePenalty').value = params.presencePenalty;
  document.getElementById('aiFrequencyPenalty').value = params.frequencyPenalty;
  document.getElementById('aiStream').checked = params.stream;
}

function openCreateModal() {
  document.getElementById('createModal').classList.remove('hidden');
  document.getElementById('createModal').classList.add('flex');
  document.getElementById('newCharName').value = '';
  document.getElementById('newCharAvatar').value = '';
  document.getElementById('newCharPersonality').value = '';
  document.getElementById('newCharBackground').value = '';
  document.getElementById('quickGenInput').value = '';
  window._tempCharData = null;
}

function closeCreateModal() {
  document.getElementById('createModal').classList.add('hidden');
  document.getElementById('createModal').classList.remove('flex');
}

function changePlatform() {
  var platform = document.getElementById('apiPlatform').value;
  var config = PLATFORM_CONFIGS[platform];
  if (config) {
    if (config.endpoint) document.getElementById('apiEndpoint').value = config.endpoint;
    if (config.model) document.getElementById('modelName').value = config.model;
  }
}

function saveSettings() {
  state.config.apiPlatform = document.getElementById('apiPlatform').value;
  state.config.apiEndpoint = document.getElementById('apiEndpoint').value;
  state.config.apiKey = document.getElementById('apiKey').value;
  state.config.modelName = document.getElementById('modelName').value;
  state.config.aiParams = normalizeAiParams({
    temperature: document.getElementById('aiTemperature').value,
    maxTokens: document.getElementById('aiMaxTokens').value || 0,
    topP: document.getElementById('aiTopP').value,
    presencePenalty: document.getElementById('aiPresencePenalty').value,
    frequencyPenalty: document.getElementById('aiFrequencyPenalty').value,
    stream: document.getElementById('aiStream').checked
  });
  saveData();
}

function resetAiParams() {
  state.config.aiParams = { ...AI_PARAM_DEFAULTS };
  loadSettingsForm();
}

// ==================== Viewport Height ====================
function updateAppHeight() {
  var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--app-height', vh + 'px');
}

// ==================== Init ====================
window.addEventListener('DOMContentLoaded', function() {
  loadData();
  applyTheme();
  renderCharacterList();
  renderChat();
  loadSettingsForm();
  updateAppHeight();

  // Event delegation for character list
  document.getElementById('characterList').addEventListener('click', function(e) {
    var actionBtn = e.target.closest('[data-action]');
    if (actionBtn) {
      e.stopPropagation();
      var action = actionBtn.dataset.action;
      var charId = actionBtn.dataset.charId;
      if (action === 'edit') openCharacterModal(charId);
      else if (action === 'delete') deleteCharacter(charId);
      return;
    }
    var card = e.target.closest('[data-char-id]');
    if (card) {
      selectCharacter(card.dataset.charId);
    }
  });

  // Event delegation for cognition modal
  document.getElementById('characterModal').addEventListener('click', function(e) {
    var target = e.target.closest('[data-cog-action]');
    if (!target) return;
    var action = target.dataset.cogAction;
    var type = target.dataset.cogType;
    if (action === 'add') addCognitionItem(type);
    else if (action === 'remove') {
      var idx = parseInt(target.dataset.cogIdx, 10);
      if (!isNaN(idx)) removeCognitionItem(type, idx);
    }
  });

  document.getElementById('messageContainer').addEventListener('click', function(e) {
    var quickReplyButton = e.target.closest('[data-quick-reply-index]');
    if (quickReplyButton) {
      var quickReplyIndex = parseInt(quickReplyButton.dataset.quickReplyIndex, 10);
      var quickReplyText = state.quickReplies[quickReplyIndex];
      if (quickReplyText) sendMessage({ text: quickReplyText });
      return;
    }
    var actionBtn = e.target.closest('[data-message-action]');
    if (!actionBtn) return;
    var messageId = actionBtn.dataset.msgId;
    if (actionBtn.dataset.messageAction === 'edit-resend') editAndResendMessage(messageId);
    else if (actionBtn.dataset.messageAction === 'regenerate') regenerateReply(messageId);
  });

  document.addEventListener('click', function(event) {
    if (!event.target.closest('.theme-menu-wrap')) toggleThemeMenu(false);
  });
});

window.addEventListener('resize', function() {
  if (window.innerWidth >= 768) {
    document.getElementById('sidebarOverlay').classList.add('hidden');
  }
  updateAppHeight();
});

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', updateAppHeight);
}
</script>
